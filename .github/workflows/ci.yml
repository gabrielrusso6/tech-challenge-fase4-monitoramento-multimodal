name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install (sem YOLO/Azure)
        run: |
          python -m pip install -r requirements-ci.txt
          python -m pip install -e . --no-deps
      - name: Tests
        run: python -m pytest -v --junitxml=runtime/junit.xml
      - name: Offline vitals evaluation smoke
        run: tc4 vitals-eval --synthetic
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.os }}-${{ matrix.python }}
          path: |
            runtime/junit.xml
            reports/vitals_evaluation_summary.csv
